name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Offline smoke scripts only: the live/drill scripts need Dota 2 and a vconsole
      # window, which a runner has not. These import from dist/, so they run after
      # Build. test-asset-{inspect,check-refs} skip on win32 (a fake VRF CLI cannot execute there).
      - name: Offline smoke tests
        run: |
          node scripts/test-relay.mjs
          node scripts/test-daemon.mjs
          node scripts/test-mcp-offline.mjs
          node scripts/test-collect-output.mjs
          node scripts/test-screenshot.mjs
          node scripts/test-vrf-ensure.mjs
          node scripts/test-asset-inspect.mjs
          node scripts/test-asset-check-refs.mjs
          node scripts/test-fileops.mjs
          node scripts/test-archived-notes.mjs
          node scripts/test-console-cursor.mjs
          node scripts/test-console-send.mjs
          node scripts/test-lua-vfx-contract.mjs
          node scripts/test-status-matrix.mjs
          node scripts/test-recorder.mjs
          node scripts/test-perf.mjs
          node scripts/test-migrate-read.mjs
          node scripts/test-migrate-write.mjs
          node scripts/test-run-lua-tests.mjs
          node scripts/test-panorama-bridge.mjs
          node scripts/test-input.mjs
          node scripts/test-mcp-stdin-exit.mjs
          node scripts/verify-changelog-tags.mjs

      - name: Package
        env:
          SEA_OUTPUT_NAME: dota2-mcp-${{ matrix.platform }}
        run: npm run package

      # A packaged binary that throws at module load still uploads fine; run it before
      # the release asset is attached. stdin EOF makes the server attach and exit.
      - name: Smoke-test packaged executable
        env:
          SEA_OUTPUT_NAME: dota2-mcp-${{ matrix.platform }}
        run: node scripts/smoke-sea-package.mjs

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dota2-mcp-${{ matrix.platform }}*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
